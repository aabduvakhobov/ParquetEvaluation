[package]
name = "parquet-writer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "low-level-writer"
path = "src/native_writer.rs"

[[bin]]
name = "default-rust-writer"
path = "src/default_rust_writer.rs"

[dependencies]
glob = "0.3.3"
parquet = "58.0.0"
arrow-schema = "58.0.0"
arrow = "58.0.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

# Silence "never used" / "never constructed" warnings for code shared between the binaries
# but not called by all of them. Only affects compiler warnings, not the generated code.
[lints.rust]
dead_code = "allow"

[profile.dev-release]
inherits = "release"
lto = false
codegen-units = 16
panic = 'unwind'